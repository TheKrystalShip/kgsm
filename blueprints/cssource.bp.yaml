schema_version: 1
name: cssource
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Counter-Strike: Source"
  description: "Counter-Strike: Source is a tactical first-person shooter by Valve that remakes the original Counter-Strike on the Source engine, pitting teams of terrorists and counter-terrorists against each other across objective-based rounds."
  rawg_slug: "counter-strike-source"
  max_players: 32
  min_ram_mb: 512
  recommended_ram_mb: 1024
  base_disk_mb: 2200
native:
  ports: 26900/udp|27015/tcp|27015/udp|27020/udp|27005/udp
  steam_app_id: 232330
  client_steam_app_id: 240
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: de_dust
  executable_subdirectory: DedicatedServer
  executable_file: srcds_run
  executable_arguments: -console -game cstrike -secure +maxplayers 22 +map $instance_level_name
  stop_command: exit
  save_command: ""
  startup_success_regex: Server started
