schema_version: 1
name: 7dtd
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "7 Days to Die"
  description: "An open-world survival horror game by The Fun Pimps set in a post-apocalyptic world, combining crafting, voxel-based construction, and tower defense against zombie hordes that intensify every seventh in-game day."
  rawg_slug: "7-days-to-die"
  max_players: 8
  min_ram_mb: 4096
  recommended_ram_mb: 8192
  base_disk_mb: 15360
native:
  ports: 26900:26903/tcp|26900:26903/udp
  steam_app_id: 294420
  client_steam_app_id: 251570
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: default
  executable_subdirectory: /bin/x86_64
  executable_file: 7DaysToDieServer.x86_64
  executable_arguments: -quit -batchmode -nographics -headless -dedicated -configfile=$instance_install_dir/serverconfig.xml
  stop_command: exit
  save_command: exit
  startup_success_regex: INF StartGame done
