schema_version: 1
name: terraria
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Terraria"
  description: "A 2D action-adventure sandbox game by Re-Logic in which players explore procedurally generated worlds, gather resources, build structures, and battle enemies and bosses in single-player or cooperative multiplayer."
  rawg_slug: "terraria"
  max_players: 255
  min_ram_mb: 1024
  recommended_ram_mb: 2048
  base_disk_mb: 55
# RCON polling — an optional second source of player presence, for a game whose
# console does not announce joins and leaves in its log, or announces only one of
# the two. Empty rcon_port leaves it off, which is what every unset field here
# means: the capability is available to this game, not yet wired up for it.
# Nothing below is guessed — fill these in only from a server observed answering
# them, the same rule the presence patterns follow.
rcon_port: ""
rcon_password: ""
rcon_poll_interval_seconds: 10
# The command that lists connected players, and how to read one player out of what
# it answers — matched per line, with optional named groups `id` and `name`. Games
# word their rosters differently, so carrying the pattern here is what lets one
# poller read any of them without knowing which game it is talking to.
rcon_players_command: ""
rcon_players_regex: ''
# Moderation, from the command list the server's own `help` prints. Terraria addresses
# players by name and has no un-ban command: a ban is lifted by removing the entry from
# banlist.txt, so unban_command is empty and KGSM refuses the action rather than
# substituting one that would not lift anything.
kick_command: 'kick {name}'
ban_command: 'ban {name}'
unban_command: ''
# The console command this game accepts to send a message to everyone connected.
# One {message} placeholder; everything else is sent verbatim.
broadcast_command: 'say {message}'
native:
  # The server holds a TCP listener only — observed on a running 1.4.5.6 server, which
  # opens no UDP socket. The protocol is stated so the firewall does not also open a UDP
  # port nothing is listening on.
  ports: '7777/tcp'
  steam_app_id: 0
  client_steam_app_id: 105600
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: default
  executable_subdirectory: ""
  executable_file: TerrariaServer.bin.x86_64
  executable_arguments: -world $instance_saves_dir/$instance_level_name -autocreate 3 -worldname $instance_level_name
  stop_command: exit
  save_command: save
  startup_success_regex: Server started
