schema_version: 1
name: starmade
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "StarMade"
  description: "StarMade is a voxel-based 3D space sandbox game developed by Schine GmbH in which players build and pilot spacecraft, explore a procedurally generated universe, and construct space stations from block-based components in multiplayer or solo."
  rawg_slug: "starmade"
  max_players: 32
  min_ram_mb: 2048
  recommended_ram_mb: 4096
  base_disk_mb: 1024
native:
  ports: 4242/tcp|4242/udp
  steam_app_id: 244770
  client_steam_app_id: 244770
  steamcmd_arguments: ""
  is_steam_account_required: true
  platform: linux
  level_name: default
  executable_subdirectory: StarMade
  executable_file: java
  executable_arguments: -Xms4G -Xmx4G -jar StarMade.jar -server
  stop_command: exit
  save_command: ""
  startup_success_regex: SERVER INIT FINISHED
