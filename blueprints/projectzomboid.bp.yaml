schema_version: 1
name: projectzomboid
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Project Zomboid"
  description: "Open-world zombie survival RPG by The Indie Stone where players must survive in a post-apocalyptic world by scavenging, building, and managing needs while fending off the undead. Supports cooperative multiplayer on dedicated servers."
  rawg_slug: "project-zomboid"
  max_players: 100
  min_ram_mb: 2048
  recommended_ram_mb: 4096
  base_disk_mb: 5120
native:
  ports: 16261:16262/udp
  steam_app_id: 380870
  client_steam_app_id: 108600
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: default
  executable_subdirectory: ""
  executable_file: start-server.sh
  executable_arguments: -servername $instance_level_name -cachedir=$instance_saves_dir
  stop_command: quit
  save_command: save
  startup_success_regex: SERVER STARTED
  player_joined_regex: 'Steam client (?<id>\d+) is initiating a connection'
  player_left_regex: ''
  rcon_port: 27015
  rcon_password: ""
  rcon_poll_interval_seconds: 10
  rcon_players_command: "players"
