schema_version: 1
name: projectzomboid
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Project Zomboid"
  description: "Open-world zombie survival RPG by The Indie Stone where players must survive in a post-apocalyptic world by scavenging, building, and managing needs while fending off the undead. Supports cooperative multiplayer on dedicated servers."
  rawg_slug: "project-zomboid"
  max_players: 100
  min_ram_mb: 8192
  recommended_ram_mb: 16384
  base_disk_mb: 7168
# Player-presence detection. RCON below is the whole of it for this game; the
# console log is deliberately left unused. The log announces a join as a Steam
# id with no name, and RCON answers `players` with a name and no id, so the two
# describe the same player with nothing in common to match on — running both
# yields two sessions per player, one of which no leave can ever retire (the
# console prints no leave line at all). The name is the half worth having:
# moderation addresses players by name, and a roster entry reading as a bare
# Steam id names nobody.
player_joined_regex: ''
player_left_regex: ''
# RCON polling — the presence source for this game, so leaving rcon_password
# empty leaves it with no presence at all. `players` answers with a header line
# and one `-Name` line per connected player. Set rcon_password (and the matching
# value in the game's own server config) to turn it on.
rcon_port: 27015
rcon_password: ""
rcon_poll_interval_seconds: 10
rcon_players_command: "players"
# `players` answers with a header line and one dash-prefixed name per player:
#   Players connected (1):
#   -Heisen
# The leading dash is what separates an entry from the header, and no id is
# stated anywhere, so only `name` is captured.
rcon_players_regex: '^-\s*(?<name>\S.*?)\s*$'
# Player moderation. Project Zomboid addresses a player by their in-game user
# name, so every template takes {name}.
# Disconnect this player; they may reconnect immediately.
kick_command: 'kick {name}'
# Disconnect this player and refuse future connections from them.
ban_command: 'banuser {name}'
# Lift a ban, allowing this player to connect again.
unban_command: 'unbanuser {name}'
native:
  ports: 16261:16262/udp
  steam_app_id: 380870
  client_steam_app_id: 108600
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: default
  executable_subdirectory: ""
  executable_file: start-server.sh
  # -adminusername/-adminpassword create the admin account non-interactively. Without
  # them the server prompts for a password on stdin and waits there indefinitely, while
  # `kgsm start` reports success and status reports Active — both true, the process is
  # running, it just never finishes starting. CHANGE_ME_ON_FIRST_START is a placeholder,
  # identical on every KGSM install: an admin account can do anything in-game, so change
  # it before the server is reachable by anyone you don't trust.
  executable_arguments: -servername $instance_level_name -cachedir=$instance_saves_dir -adminusername admin -adminpassword CHANGE_ME_ON_FIRST_START
  stop_command: quit
  save_command: save
  startup_success_regex: SERVER STARTED
