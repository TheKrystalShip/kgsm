schema_version: 1
name: lotrrtm
runtime: container
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "The Lord of the Rings: Return to Moria"
  description: "A survival crafting game set in the Fourth Age of Middle-earth, developed by Free Range Games, in which players lead Dwarves to reclaim the Mines of Moria through resource gathering, crafting, and combat in procedurally generated underground realms."
  rawg_slug: "the-lord-of-the-rings-return-to-moria"
  max_players: 8
  min_ram_mb: 8192
  recommended_ram_mb: 16384
  base_disk_mb: 3584
# RCON polling — an optional second source of player presence, for a game whose
# console does not announce joins and leaves in its log, or announces only one of
# the two. Empty rcon_port leaves it off, which is what every unset field here
# means: the capability is available to this game, not yet wired up for it.
# Nothing below is guessed — fill these in only from a server observed answering
# them, the same rule the presence patterns follow.
rcon_port: ""
rcon_password: ""
rcon_poll_interval_seconds: 10
# The command that lists connected players, and how to read one player out of what
# it answers — matched per line, with optional named groups `id` and `name`. Games
# word their rosters differently, so carrying the pattern here is what lets one
# poller read any of them without knowing which game it is talking to.
rcon_players_command: ""
rcon_players_regex: ''
container:
  compose: |-
    services:
      lotrrtm:

        # Official image for Lord of the Rings: Return to Moria
        image: ghcr.io/thekrystalship/lotrrtm:latest

        # Dynamic container name
        container_name: ${instance_name}

        # Use the host’s network stack directly
        network_mode: host

        # Ensure these ports are forwarded to allow external access
        ports:
          - 7777:7777/udp
          - 27015:27015/udp
          - 27016:27016/udp

        # Bind mount volumes for persistent storage
        volumes:
          - type: bind
            source: ${instance_backups_dir}
            target: /opt/lotrrtm/backups
          - type: bind
            source: ${instance_install_dir}
            target: /opt/lotrrtm/install
          - type: bind
            source: ${instance_logs_dir}
            target: /opt/lotrrtm/logs
          - type: bind
            source: ${instance_saves_dir}
            target: /opt/lotrrtm/saves
          - type: bind
            source: ${instance_temp_dir}
            target: /opt/lotrrtm/temp
          # Player-presence event channel: the in-image shim writes
          # events.ndjson here; the kgsm-watchdog tails it.
          - type: bind
            source: ${instance_events_dir}
            target: /run/kgsm

        # Environment variables passed to the container
        environment:
          INSTANCE_AUTO_UPDATE: ${instance_auto_update}
          STEAMCMD_ADDITIONAL_ARGS: ""
          # Player-presence detection patterns (base64-encoded; empty = that
          # detection is disabled until a curated regex is set on the blueprint).
          KGSM_PLAYER_JOINED_REGEX_B64: ${instance_player_joined_regex_b64}
          KGSM_PLAYER_LEFT_REGEX_B64: ${instance_player_left_regex_b64}

        # Restart policy to keep the container running
        restart: unless-stopped
