schema_version: 1
name: necesse
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Necesse"
  description: "Top-down action-adventure sandbox RPG by Fair Games ApS where players build settlements, recruit NPC settlers, craft gear, and explore procedurally generated worlds while battling dungeons and bosses in single-player or multiplayer."
  rawg_slug: "necesse"
  max_players: 250
  min_ram_mb: 2048
  recommended_ram_mb: 4096
  base_disk_mb: 279
# Player-presence detection, authored from real server output (see
# player-presence-contract.md). The two sides carry disjoint identity: the connect
# line has the account id and the endpoint but no character name, and the
# disconnect line has the account id and the name but no endpoint. The account id
# is the only field on both, so `key` pins the session key to it — leaving the
# precedence to fall through would key the join on `addr` and the leave on `id`
# and the pair would never resolve. `\d+` for the id also rejects the
# `Client "N/A" connected on slot` form the server logs for a returning player,
# which carries no identity at all.
player_joined_regex: 'Client "(?<key>(?<id>\d+))" with address (?<addr>\S+) is connecting with version '
player_left_regex: 'Player (?<key>(?<id>\d+)) \("(?<name>[^"]*)"\) disconnected with message: (?<reason>.*)'
# RCON polling — an optional second source of player presence, for a game whose
# console does not announce joins and leaves in its log, or announces only one of
# the two. Empty rcon_port leaves it off, which is what every unset field here
# means: the capability is available to this game, not yet wired up for it.
# Nothing below is guessed — fill these in only from a server observed answering
# them, the same rule the presence patterns follow.
rcon_port: ""
rcon_password: ""
rcon_poll_interval_seconds: 10
# The command that lists connected players, and how to read one player out of what
# it answers — matched per line, with optional named groups `id` and `name`. Games
# word their rosters differently, so carrying the pattern here is what lets one
# poller read any of them without knowing which game it is talking to.
rcon_players_command: ""
rcon_players_regex: ''
native:
  ports: 14159/tcp|14159/udp
  steam_app_id: 1169370
  client_steam_app_id: 1169040
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: default
  executable_subdirectory: ""
  executable_file: StartServer-nogui.sh
  executable_arguments: -world $instance_level_name -localdir
  stop_command: exit
  save_command: ""
  startup_success_regex: Started server using port
