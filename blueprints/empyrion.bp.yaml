schema_version: 1
name: empyrion
runtime: container
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Empyrion - Galactic Survival"
  description: "Open-world space sandbox survival game by Eleon Game Studios in which players explore planets, mine resources, and construct ships, ground vehicles, and bases. Supports both single-player and dedicated multiplayer."
  rawg_slug: "empyrion-galactic-survival"
  max_players: null
  min_ram_mb: 8192
  recommended_ram_mb: 16384
  base_disk_mb: null
container:
  compose: |-
    services:
      empyrion:

        # Official KGSM Empyrion Docker image
        image: ghcr.io/thekrystalship/empyrion:latest

        # Dynamic container name
        container_name: ${instance_name}

        # Use the host’s network stack directly
        network_mode: host

        # Ensure these ports are forwarded to allow external access
        ports:
          - 30000:30000/udp
          - 30001:30001/udp
          - 30002:30002/udp
          - 30003:30003/udp
          - 27015:27015/udp
          - 27016:27016/udp

        # Bind mount volumes for persistent storage
        volumes:
          - type: bind
            source: ${instance_backups_dir}
            target: /opt/empyrion/backups
          - type: bind
            source: ${instance_install_dir}
            target: /opt/empyrion/install
          - type: bind
            source: ${instance_logs_dir}
            target: /opt/empyrion/logs
          - type: bind
            source: ${instance_saves_dir}
            target: /opt/empyrion/saves
          - type: bind
            source: ${instance_temp_dir}
            target: /opt/empyrion/temp
          # Player-presence event channel: the in-image shim writes
          # events.ndjson here; the kgsm-watchdog tails it.
          - type: bind
            source: ${instance_events_dir}
            target: /run/kgsm

        # Environment variables for the game server
        environment:
          INSTANCE_AUTO_UPDATE: ${instance_auto_update}
          STEAMCMD_ADDITIONAL_ARGS: ""
          # Player-presence detection patterns (base64-encoded; empty = that
          # detection is disabled until a curated regex is set on the blueprint).
          KGSM_PLAYER_JOINED_REGEX_B64: ${instance_player_joined_regex_b64}
          KGSM_PLAYER_LEFT_REGEX_B64: ${instance_player_left_regex_b64}

        # Restart policy to ensure the container restarts automatically
        restart: unless-stopped
