schema_version: 1
name: romestead
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Romestead"
  description: "A cooperative survival and town-building game set in a fallen Roman civilization, developed by Beartwigs. Players gather resources, construct settlements, and defend against undead enemies for 1-8 players."
  rawg_slug: "romestead"
  max_players: 8
  min_ram_mb: 4096
  recommended_ram_mb: 8192
  base_disk_mb: 4096
# Player-presence detection, authored from real server output (field
# contract: templates/blueprint.tp). Direct-socket game: leave carries only the
# endpoint, so `addr` is the correlation token on both sides.
player_joined_regex: 'Character ''(?<name>[^'']+)'' \(Peer \d+ - (?<addr>[\d.]+:\d+)\) logged in'
player_left_regex: 'Peer (?<addr>[\d.]+:\d+) disconnected'
# RCON polling — an optional second source of player presence, for a game whose
# console does not announce joins and leaves in its log, or announces only one of
# the two. Empty rcon_port leaves it off, which is what every unset field here
# means: the capability is available to this game, not yet wired up for it.
# Nothing below is guessed — fill these in only from a server observed answering
# them, the same rule the presence patterns follow.
rcon_port: ""
rcon_password: ""
rcon_poll_interval_seconds: 10
# The command that lists connected players, and how to read one player out of what
# it answers — matched per line, with optional named groups `id` and `name`. Games
# word their rosters differently, so carrying the pattern here is what lets one
# poller read any of them without knowing which game it is talking to.
rcon_players_command: ""
rcon_players_regex: ''
# Player moderation. Romestead addresses a player by IP address alone — it has
# no notion of a persistent account id — so every template takes {ip}.
# Disconnect the player at this address; they may reconnect immediately.
kick_command: 'kick {ip}'
# Disconnect the player at this address and refuse future connections from it.
ban_command: 'ban {ip}'
# Lift a ban, allowing this address to connect again.
unban_command: 'unban {ip}'
native:
  ports: 8050/udp
  steam_app_id: 4763510
  client_steam_app_id: 1805320
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: default
  executable_subdirectory: ""
  executable_file: dotnet
  executable_arguments: Server.dll
  stop_command: stop
  save_command: save
  startup_success_regex: "Server started on port"
