schema_version: 1
name: corekeeper
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Core Keeper"
  description: "A top-down sandbox survival game set in a procedurally generated underground world, combining mining, crafting, farming, and combat. Developed by Pugstorm; supports 1–8 players co-op."
  rawg_slug: "core-keeper"
  max_players: null
  min_ram_mb: 4096
  recommended_ram_mb: 6144
  base_disk_mb: 653
# Player-presence detection, authored from real server output (see
# player-presence-plan.md). Opaque session token (`userid`) — correlate on
# `key`; the leave line also carries a disconnect `reason`.
player_joined_regex: '\[userid:(?<key>\d+)\] player (?<name>.+?) connected'
player_left_regex: 'Disconnected from userid:(?<key>\d+) with reason (?<reason>\S+)'
# RCON polling — an optional second source of player presence, for a game whose
# console does not announce joins and leaves in its log, or announces only one of
# the two. Empty rcon_port leaves it off, which is what every unset field here
# means: the capability is available to this game, not yet wired up for it.
# Nothing below is guessed — fill these in only from a server observed answering
# them, the same rule the presence patterns follow.
rcon_port: ""
rcon_password: ""
rcon_poll_interval_seconds: 10
# The command that lists connected players, and how to read one player out of what
# it answers — matched per line, with optional named groups `id` and `name`. Games
# word their rosters differently, so carrying the pattern here is what lets one
# poller read any of them without knowing which game it is talking to.
rcon_players_command: ""
rcon_players_regex: ''
native:
  ports: "22420"
  steam_app_id: 1963720
  client_steam_app_id: 1621690
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: default
  executable_subdirectory: ""
  executable_file: _launch.sh
  executable_arguments: ""
  stop_command: ""
  save_command: ""
  startup_success_regex: Game ID
