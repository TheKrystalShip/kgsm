schema_version: 1
name: palworld
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Palworld"
  description: "An open-world survival and creature-collection game by Pocketpair where players catch, breed, and battle alongside creatures called Pals while building bases, farming, and automating factories; supports co-op multiplayer of up to 32 players on a dedicated server."
  rawg_slug: "palworld"
  max_players: 32
  min_ram_mb: 8192
  recommended_ram_mb: 16384
  base_disk_mb: 8192
# Player-presence detection, authored from real server output (see
# player-presence-plan.md). Self-identifying both sides — `id` is the
# correlation token on both join and leave. The join edge is "joined the
# server" (player loaded into the world), not the earlier "connected" line.
# Palworld is crossplay: `User id:` carries a platform prefix (`steam_` +
# SteamID64, `gdk_` + Xbox XUID), so both prefixes match. The prefix stays
# OUT of the `id` capture — the bare account number is the roster identity,
# and the two number spaces (17-digit SteamID64, 16-digit XUID) don't collide.
player_joined_regex: '\[LOG\] (?<name>.+?) joined the server\. \(User id: (?:steam|gdk)_(?<id>\d+)'
player_left_regex: '\[LOG\] (?<name>.+?) left the server\. \(User id: (?:steam|gdk)_(?<id>\d+)'
# Player moderation. Palworld addresses a player by account id — the bare number
# the join line carries and `/ShowPlayers` lists — so every template takes {id},
# the same token the presence regexes capture.
# Disconnect this account; they may reconnect immediately.
kick_command: '/KickPlayer {id}'
# Disconnect this account and refuse future connections from it.
ban_command: '/BanPlayer {id}'
# Lift a ban, allowing this account to connect again.
unban_command: '/UnBanPlayer {id}'
native:
  ports: 8211/udp|27015/udp
  steam_app_id: 2394010
  client_steam_app_id: 1623730
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: default
  executable_subdirectory: ""
  executable_file: PalServer.sh
  executable_arguments: -useperfthreads -NoAsyncLoadingThread -UseMultithreadForDS -publicport=8211 -players=32
  stop_command: "/Shutdown"
  save_command: "/Save"
  startup_success_regex: Bringing World /Pal/Maps/MainWorld up for play
