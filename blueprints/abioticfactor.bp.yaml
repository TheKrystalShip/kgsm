schema_version: 1
name: abioticfactor
runtime: container
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: null
  description: null
  max_players: null
  min_ram_mb: null
  recommended_ram_mb: null
  base_disk_mb: null
container:
  compose: |-
    services:
      abioticfactor:

        # Official KGSM Abiotic Factor Docker image
        image: ghcr.io/thekrystalship/abioticfactor:latest

        # Dynamic container name
        container_name: ${instance_name}

        # Use the host’s network stack directly
        network_mode: host

        # Ensure these ports are forwarded to allow external access
        ports:
          - 7777:7777/udp
          - 27015:27015/udp
          - 27016:27016/udp

        # Bind mount volumes for persistent storage
        volumes:
          - type: bind
            source: ${instance_backups_dir}
            target: /opt/abioticfactor/backups
          - type: bind
            source: ${instance_install_dir}
            target: /opt/abioticfactor/install
          - type: bind
            source: ${instance_logs_dir}
            target: /opt/abioticfactor/logs
          - type: bind
            source: ${instance_saves_dir}
            target: /opt/abioticfactor/saves
          - type: bind
            source: ${instance_temp_dir}
            target: /opt/abioticfactor/temp

        # Environment variables for the game server
        environment:
          INSTANCE_AUTO_UPDATE: ${instance_auto_update}
          STEAMCMD_ADDITIONAL_ARGS: ""
          MAX_SERVER_PLAYERS: 8
          PORT: 7777
          QUERY_PORT: 27015
          SERVER_PASSWORD: change_me
          STEAM_SERVER_NAME: KGSM
          WORLD_SAVE_NAME: Cascade
          ADDITIONAL_LAUNCH_ARGS: ""

        # Restart policy to ensure the container restarts automatically
        restart: unless-stopped
