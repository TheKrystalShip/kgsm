schema_version: 1
name: stationeers
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Stationeers"
  description: "A space station construction and management game by Rocketwerkz in which players build and operate a station with complex simulated atmospheric, electrical, and manufacturing systems, playable solo or in multiplayer."
  rawg_slug: "stationeers"
  max_players: 30
  min_ram_mb: 6144
  recommended_ram_mb: 12288
  base_disk_mb: null
# Player-presence detection, authored from real server output (see
# player-presence-plan.md). Self-identifying both sides (SteamID64) — `id` is
# the correlation token on both join and leave.
player_joined_regex: 'Client (?<name>.+?) \((?<id>\d+)\) is ready'
player_left_regex: 'Client disconnected: \d+ \| (?<name>.+?)\s+connectTime:.*ClientId: (?<id>\d+)'
native:
  ports: 27015:27015/udp
  steam_app_id: 600760
  client_steam_app_id: 544550
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: Lunar
  executable_subdirectory: ""
  executable_file: rocketstation_DedicatedServer.x86_64
  executable_arguments: -file start MyLunaLevel ${instance_level_name} -logFile ${instance_log_file} -settings StartLocalHost true ServerVisible true GamePort 27016 UPNPEnabled true ServerName CHANGE_ME ServerPassword CHANGE_ME ServerMaxPlayers 8 AutoSave true SaveInterval 300 ServerAuthSecret ADMIN_PASS UpdatePort 27015 AutoPauseServer trye UseSteamP2P false LocalIpAddress 0.0.0.0
  stop_command: exit
  save_command: exit
  startup_success_regex: started Server
