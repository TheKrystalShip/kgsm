schema_version: 1
name: minecraft
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Minecraft"
  description: "Open-world sandbox survival game by Mojang Studios in which players explore, gather resources, craft, and build in procedurally generated 3D block worlds; supports both survival and creative modes."
  rawg_slug: "minecraft"
  max_players: 20
  min_ram_mb: 1024
  recommended_ram_mb: 2048
  base_disk_mb: 120
# Player-presence detection, authored from real server output (field
# contract: templates/blueprint.tp). The connection pair is used rather than the
# "joined/left the game" chat broadcasts: it is core server logging a plugin or
# mod does not reword, and it carries the address and the disconnect reason.
# Minecraft logs the account UUID on a separate line ("UUID of player X is …"),
# which a per-line matcher cannot correlate, so `id` stays absent and the
# username is the identity. `key` pins the session key to that username on both
# sides, since the address is present only on the join line. The username is
# matched as Minecraft's legal charset anchored to the start of the message, so
# the pre-login `com.mojang.authlib.GameProfile@…(/ip:port) lost connection`
# form — a disconnect by someone who never joined — does not match.
player_joined_regex: '\[Server thread/INFO\]: (?<key>(?<name>[A-Za-z0-9_]{1,16}))\[/(?<addr>.+)\] logged in with entity id '
player_left_regex: '\[Server thread/INFO\]: (?<key>(?<name>[A-Za-z0-9_]{1,16})) lost connection: (?<reason>.*)'
# RCON polling — an optional second source of player presence, for a game whose
# console does not announce joins and leaves in its log, or announces only one of
# the two. Empty rcon_port leaves it off, which is what every unset field here
# means: the capability is available to this game, not yet wired up for it.
# Nothing below is guessed — fill these in only from a server observed answering
# them, the same rule the presence patterns follow.
rcon_port: ""
rcon_password: ""
rcon_poll_interval_seconds: 10
# The command that lists connected players, and how to read one player out of what
# it answers — matched per line, with optional named groups `id` and `name`. Games
# word their rosters differently, so carrying the pattern here is what lets one
# poller read any of them without knowing which game it is talking to.
rcon_players_command: ""
rcon_players_regex: ''
# Player moderation. Minecraft addresses a player by username — the same token
# the presence regexes capture — and keeps the ban list keyed on the account, so
# every template takes {name}.
# Disconnect this player; they may reconnect immediately.
kick_command: '/kick {name}'
# Disconnect this player and refuse future connections from the account.
ban_command: '/ban {name}'
# Lift a ban, allowing this account to connect again.
unban_command: '/pardon {name}'
native:
  # The game listens on TCP; the optional GS4 query listener uses UDP on the same
  # number, so the protocol is left off to open both and enabling query later
  # needs no firewall change.
  ports: '25565'
  steam_app_id: 0
  client_steam_app_id: 0
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: default
  executable_subdirectory: ""
  executable_file: java
  executable_arguments: -Xmx4096M -Xms4096M -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -jar release.jar nogui
  stop_command: /stop
  save_command: /save-all
  startup_success_regex: For help, type \"help\"
