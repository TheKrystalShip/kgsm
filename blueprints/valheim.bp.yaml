schema_version: 1
name: valheim
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Valheim"
  description: "A Viking-themed survival and exploration game by Iron Gate Studio where players gather resources, build bases, and fight mythical creatures in procedurally generated worlds. Supports cooperative multiplayer with up to 10 players on a dedicated server."
  rawg_slug: "valheim"
  max_players: 10
  min_ram_mb: 2048
  recommended_ram_mb: 4096
  base_disk_mb: 5120
# Player-presence detection, authored from real server output (field
# contract: templates/blueprint.tp). Scattered identity (SteamID and name never
# co-located) — correlate on the ZDOID's owner half (`key`), which the leave
# line repeats verbatim and which survives a death-and-respawn within the same
# connection; `id` stays null (bridging it to the character would be a
# cross-layer guess). A ZDOID is a SIGNED 32-bit id, so roughly half of them
# are negative and the sign is part of the token on both lines. `0:0` is the
# none-ZDOID the server sends when a character is destroyed — the player is
# still connected, so it is excluded rather than read as an arrival.
player_joined_regex: 'Got character ZDOID from (?<name>.+?) : (?!0:0)(?<key>-?\d+):\d+'
player_left_regex: 'Destroying abandoned non persistent zdo -?\d+:\d+ owner (?<key>-?\d+)'
# RCON polling — an optional second source of player presence, for a game whose
# console does not announce joins and leaves in its log, or announces only one of
# the two. Empty rcon_port leaves it off, which is what every unset field here
# means: the capability is available to this game, not yet wired up for it.
# Nothing below is guessed — fill these in only from a server observed answering
# them, the same rule the presence patterns follow.
rcon_port: ""
rcon_password: ""
rcon_poll_interval_seconds: 10
# The command that lists connected players, and how to read one player out of what
# it answers — matched per line, with optional named groups `id` and `name`. Games
# word their rosters differently, so carrying the pattern here is what lets one
# poller read any of them without knowing which game it is talking to.
rcon_players_command: ""
rcon_players_regex: ''
# Moderation. Valheim's kick, ban and unban exist only as admin commands in a connected
# client's F5 console, which reach the server as RPCs from a player listed in adminlist.txt.
# The dedicated server reads nothing from stdin (a line written to its console is still
# unread in the FIFO long after), so a template here would be delivered to nobody and
# reported as done. They stay empty, as does broadcast_command for the same reason, and
# KGSM refuses the actions.
#
# The server does act on bannedlist.txt (beside the world, under -savedir) while running:
# every 5s it re-reads the file if its mtime changed and kicks every connected player the
# file names, by character name or platform id (`Steam_<id>`, or a bare SteamID64). Adding
# a line is a ban that takes effect within ~15s; removing it is the unban.
kick_command: ''
ban_command: ''
unban_command: ''
broadcast_command: ''
native:
  # UDP only. A ready server binds both 2456 and 2457; 2456 appears late, once the world is
  # generated, so a server checked mid-generation looks like it uses only port+1. The vendor's
  # launch script asks for 2456-2458 to be forwarded, so the range is kept; the TCP half is
  # dropped because no TCP socket is ever opened.
  ports: '2456:2458/udp'
  steam_app_id: 896660
  client_steam_app_id: 892970
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: default
  executable_subdirectory: ""
  # The shipped start_server.sh hardcodes its own -name/-world/-password and passes nothing
  # through, so every instance launched by it would be the same server. The binary beside it
  # takes the arguments, and runs without the wrapper's LD_LIBRARY_PATH.
  executable_file: valheim_server.x86_64
  # -savedir keeps the world inside the instance; without it Valheim writes to
  # ~/.config/unity3d/IronGate/Valheim and the instance's backups capture nothing.
  # The server REFUSES TO START without a password of at least 5 characters, so one is shipped
  # and is meant to be replaced — see docs/knowledge/games/valheim/setup.md.
  executable_arguments: -nographics -batchmode -name $instance_level_name -world $instance_level_name -savedir $instance_saves_dir -port 2456 -password CHANGE_ME -public 1
  # Valheim reads no console commands. Stopping is a signal, which the server handles by
  # saving the world before it exits, so there is nothing to send it.
  stop_command: ""
  save_command: ""
  # Printed once the world is generated and the server is registered in the lobby — on a first
  # start that is well over a minute after the networking is up, so it is the line that means
  # "ready for players" rather than "process is alive".
  startup_success_regex: Opened Steam server
