schema_version: 1
name: valheim
runtime: native
metadata:
  # TODO: curate — advisory values researched per game; null = unknown/unbounded, NEVER 0
  display_name: "Valheim"
  description: "A Viking-themed survival and exploration game by Iron Gate Studio where players gather resources, build bases, and fight mythical creatures in procedurally generated worlds. Supports cooperative multiplayer with up to 10 players on a dedicated server."
  rawg_slug: "valheim"
  max_players: 10
  min_ram_mb: 2048
  recommended_ram_mb: 4096
  base_disk_mb: 5120
# Player-presence detection, authored from real server output (see
# player-presence-plan.md). Scattered identity (SteamID and name never
# co-located) — correlate on the ZDOID (`key`); `id` stays null (bridging it
# to the character would be a cross-layer guess).
player_joined_regex: 'Got character ZDOID from (?<name>.+?) : (?<key>\d+):\d+'
player_left_regex: 'Destroying abandoned non persistent zdo \d+:\d+ owner (?<key>\d+)'
native:
  ports: 2456:2458/tcp|2456:2458/udp
  steam_app_id: 896660
  client_steam_app_id: 892970
  steamcmd_arguments: ""
  is_steam_account_required: false
  platform: linux
  level_name: default
  executable_subdirectory: ""
  executable_file: start_server_bepinex.sh
  executable_arguments: -nographics -batchmode -name $instance_level_name -port 2456 -public 1
  stop_command: exit
  save_command: ""
  startup_success_regex: Opened Steam server
