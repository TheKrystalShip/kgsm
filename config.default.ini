# ============================================================================
# KGSM - Krystal Game Server Manager
# Configuration File
# ============================================================================
#
# This is the main configuration file for the Krystal Game Server Manager.
# You can customize your KGSM installation by modifying the settings below.
#
# IMPORTANT NOTES:
#  - All settings can also be set as environment variables
#  - Uncommented values in this file override environment variables
#  - Use '#' for comments to maintain bash script compatibility
#  - All paths should be absolute unless otherwise specified
#
# ============================================================================
config_schema_version=10

[system]

# WGET TIMEOUT
# How long should wget wait for network activity before timing out?
# This timeout triggers when NO DATA is received for the specified duration.
# It does NOT abort active downloads that are slow but progressing.
# Applies to all wget operations: downloads, API calls, version checks.
#
# Dependencies: wget
#
# Expected values:
#   Positive integer (seconds)
#
# Default: 60
wget_timeout_seconds=60

# ENABLE LOGGING
# Should KGSM write detailed logs of all operations?
# When enabled, logs will be stored in the $KGSM_ROOT/logs directory to help
# with troubleshooting and auditing server activities.
#
# Expected values:
#   false  - Disable logging
#   true   - Enable detailed logging
#
# Default: false
enable_logging=false

# LOG FILE MAX SIZE
# Maximum size allowed for log files before rotation occurs.
# Once a log file reaches this size, it will be archived and a new log file created.
#
# Expected values:
#   Any positive integer (in kilobytes)
#
# Default: 10240 (10 MB)
log_max_size_kb=10240

[steam]
# STEAM CREDENTIALS
# Login details for SteamCMD to download game servers requiring authentication.
# The environment wins when both are set; these are the fallback, and are what
# non-interactive callers use — a systemd unit and the watchdog carry no login
# environment, so a Steam-account game relies on the values here.
#
# STEAM_PASSWORD is optional, and on a host that has logged in once it should be
# left empty. SteamCMD stores a refresh token after a login that satisfies Steam
# Guard, and a username-only login spends that token, so downloads run unattended
# with Steam Guard left enabled and no password stored anywhere. Supplying a
# password takes the password path even when a token is stored, and that path
# replaces the stored token. To establish the token, log in by hand once:
#   steamcmd +login <username> +quit      (approve the prompt, then leave this empty)
#
# SECURITY WARNING: a value in STEAM_PASSWORD is a plain-text password on disk.
# Keep this file readable only by its owner (chmod 600).
#
# Expected values:
#   A valid Steam username; a password only until the host has logged in once
#
# Default: Empty (environment, or a stored refresh token)
STEAM_USERNAME=
STEAM_PASSWORD=

[cgroup]
# ENABLE CGROUP SUPERVISION
# Should KGSM supervise native game-server instances using cgroup v2?
# When enabled, each native instance is spawned into a kernel-tracked cgroup so
# that crash detection, whole-process-tree teardown, and accurate per-instance
# metrics work without systemd as the lifecycle manager. The cgroup base is
# prepared by kgsm-watchdog under systemd cgroup delegation (Slice=kgsm.slice,
# Delegate=yes) — no manual setup step. ('kgsm system setup-cgroups' is legacy.)
#
# Dependencies: cgroup v2 (unified hierarchy), Linux kernel >= 5.14
#
# Expected values:
#   false  - Don't use cgroup supervision (native instances track a bare PID)
#   true   - Supervise native instances via cgroup v2
#
# Default: true
enable_cgroups=true

# CGROUP MOUNT POINT
# Where is the cgroup v2 unified hierarchy mounted?
# On modern systemd and most current distributions this is /sys/fs/cgroup.
#
# Expected values:
#   Absolute path to the cgroup v2 mount
#
# Default: /sys/fs/cgroup
cgroup_mount_point=/sys/fs/cgroup

# CGROUP BASE NAME
# KGSM's delegated cgroup base, relative to the mount point. Per-instance cgroups
# are created beneath it (e.g. <mount>/<base>/<instance>) and kgsm surfaces that
# path to kgsm-monitor as each instance's `cgroup_path`.
#
# This MUST match where kgsm-watchdog actually creates the cgroups. Under systemd
# cgroup delegation the watchdog runs as a service in kgsm.slice (Delegate=yes) and
# owns the subtree below its own service cgroup, so the base is the delegated
# service cgroup: kgsm.slice/kgsm-watchdog.service. (Children must live below the
# service, not as siblings under kgsm.slice — systemd reconciles a slice's own
# subtree_control on daemon-reload and would strip the controllers off siblings,
# which is what made per-server memory metrics read 0.) If you rename the watchdog
# systemd unit, update this to match.
#
# Expected values:
#   A cgroup path relative to the mount, slashes allowed (e.g.
#   kgsm.slice/kgsm-watchdog.service). The '.slice' suffix is systemd-recognized.
#
# Default: kgsm.slice/kgsm-watchdog.service
cgroup_base_name=kgsm.slice/kgsm-watchdog.service

# CGROUP CONTROLLERS
# Which cgroup controllers should be enabled for KGSM's instances?
# These are delegated into the base's subtree_control so per-instance cgroups
# can account and limit them. 'cpu' and 'memory' drive metrics; 'pids' bounds
# fork bombs; 'io' enables per-instance disk-IO accounting.
#
# Expected values:
#   Space-separated list of cgroup v2 controller names
#
# Default: cpu memory io pids
cgroup_controllers=cpu memory io pids

[resources]
# ENABLE THE MEMORY GATE
# Should KGSM refuse to start an instance the node does not have room for?
#
# Before a native instance is spawned, the gate compares the memory the node has
# available against what the instance is expected to need, and refuses the start
# when going ahead would leave less than memory_gate_headroom_mb free. A node
# driven into the OOM killer loses whichever process the kernel picks — which may
# be a different game server, or the watchdog supervising all of them — so a
# refused start is the cheaper outcome by a wide margin.
#
# THIS KEY IS READ BY BOTH kgsm AND kgsm-watchdog. The CLI is not the only thing
# that starts instances: the watchdog starts them at boot (autostart) and after a
# crash (restart), never passing through kgsm. Both consult this same value, so
# turning the gate off here turns it off everywhere.
#
# Expected values:
#   false  - Start instances regardless of available memory
#   true   - Refuse a start that would breach the headroom floor
#
# Default: true
enable_memory_gate=true

# MEMORY GATE HEADROOM
# How many megabytes must remain available AFTER an instance starts.
#
# This is the node's reserve — for the kernel, the watchdog, the monitor, and
# whatever else has to keep running while the games do. The check is:
#
#   MemAvailable - required >= memory_gate_headroom_mb
#
# MemAvailable (not MemFree) is the reading used: MemFree excludes reclaimable
# page cache, which the kernel hands back on demand, so gating on it would refuse
# starts that are perfectly safe.
#
# What "required" means, in order: the instance's own memory_cap_mb when it is set
# (the cgroup ceiling the watchdog enforces, so it bounds what the node can lose),
# otherwise the blueprint's advisory metadata.min_ram_mb. When neither is known
# the gate cannot answer and the start proceeds — an undeclared figure is never
# invented, and the log says the check could not run.
#
# Expected values:
#   A whole number of megabytes, 0 or greater. 0 disables the reserve while
#   leaving the gate on, which still refuses a start that cannot fit at all.
#
# Default: 1024
memory_gate_headroom_mb=1024

[network]
# ENABLE FIREWALL MANAGEMENT
# Should KGSM automatically configure firewall rules for game servers?
# When enabled, KGSM hands each instance's ports to the kgsm-firewall
# authority, which owns the host firewall and opens/closes them under a
# rule tagged kgsm-<instance>. KGSM itself renders no rules and chooses no
# backend (the authority detects ufw/firewalld/nft).
#
# An instance's ports are open exactly while it is running: they open on
# every bring-up (including a boot auto-start and a crash-respawn) and are
# released on a deliberate stop, so a server that is not running holds
# nothing open on the host.
#
# Dependencies: a reachable kgsm-firewall authority. An unreachable one is
# reported and never blocks a start — a server behind a shut port is a
# problem to see, not a reason to keep the server down.
#
# Expected values:
#   false  - Don't manage firewall rules
#   true   - Automatically manage firewall rules
#
# Default: false
enable_firewall_management=false

# ENABLE UPnP PORT FORWARDING
# Should KGSM forward each native instance's ports on the local router via UPnP?
# When enabled, the resident supervisor (kgsm-watchdog) opens the instance's
# ports as UPnP mappings on the IGD (router) on bring-up and closes them on a
# deliberate stop, shelling `upnpc` — best-effort, never a hard dependency. This
# is a per-instance default materialized into each new instance's config; toggle
# it per-instance at runtime with `kgsm instances config-set <instance> enable_port_forwarding=true`.
# Distinct from firewall management: this opens the ROUTER (NAT forward), the
# firewall opens the HOST (ufw rule) — a host may want one without the other.
#
# Dependencies: a UPnP-capable router and `upnpc` (miniupnpc) on the host. A slow,
# absent, or UPnP-disabled router is logged and skipped — it never blocks a start.
#
# Expected values:
#   false  - Don't forward ports via UPnP
#   true   - Forward each native instance's ports via UPnP
#
# Default: false
enable_port_forwarding=false

[events]
# EVENT JOURNAL DIRECTORY
# Where KGSM appends its event journal.
#
# The journal is KGSM's event transport and its audit record: one JSON line per
# event, in date-named segments (YYYY-MM-DD.ndjson) that sort chronologically.
# KGSM appends and knows nothing about who reads — consumers tail the segments
# at their own pace holding their own cursor, so adding or removing a consumer
# needs no change here.
#
# Emission is unconditional. There is deliberately no switch that turns the
# journal off: it is the audit record, and an audit trail that can be silently
# disabled is worse than no audit trail at all.
#
# Expected values:
#   An absolute path, or a path starting with ~ (expanded to $HOME)
#
# Default: /var/lib/kgsm/events
event_journal_dir=/var/lib/kgsm/events

# EVENT JOURNAL RETENTION
# How many days of journal segments to keep.
#
# `events journal prune` deletes segments older than this. Retention is
# time-based only and never consults a consumer — KGSM holds no knowledge of
# who reads the journal, which is the point of the design. A consumer absent
# longer than this window detects the gap and cold-starts.
#
# Keep this >= the retention of any index built from the journal (kgsm-monitor's
# event history), or rebuilding that index returns less than it held.
#
# Expected values:
#   A positive integer (days)
#
# Default: 90
event_journal_retention_days=90

# ENABLE WEBHOOK EVENTS
# Should KGSM send events to webhook endpoints via HTTP POST?
# When enabled, KGSM will send JSON event data to configured webhook URLs.
# This provides HTTP-based event delivery for broader integration capabilities.
#
# Dependencies: wget
#
# Expected values:
#   false  - Don't send webhook events
#   true   - Enable webhook event delivery
#
# Default: false
enable_webhook_events=false

# WEBHOOK URLS
# Webhook endpoint URLs for receiving KGSM events.
# Multiple URLs can be specified as a comma-separated list.
# Events will be sent as HTTP POST requests with JSON payloads to all URLs.
# Only used when webhook events are enabled.
#
# Expected values:
#   Valid HTTP/HTTPS URL or comma-separated list of URLs
#   Examples: https://example.com/webhook
#            https://primary.com/webhook,https://backup.com/webhook
#
# Default: Empty (must be configured to use webhooks)
webhook_urls=

# WEBHOOK TIMEOUT
# How long should KGSM wait for webhook HTTP requests to complete?
# This prevents webhook failures from blocking KGSM operations.
#
# Expected values:
#   Positive integer (seconds)
#
# Default: 10
webhook_timeout_seconds=10

# WEBHOOK RETRY COUNT
# How many times should KGSM retry failed webhook requests?
# Failed requests will be retried with exponential backoff.
#
# Expected values:
#   Integer between 0 and 5
#
# Default: 2
webhook_retry_count=2

# WEBHOOK SECRET
# Optional secret key for webhook authentication.
# When set, KGSM will include an X-KGSM-Signature header with HMAC-SHA256
# signature of the payload for webhook endpoint verification.
#
# Expected values:
#   String (leave empty to disable signature verification)
#
# Default: Empty (no signature verification)
webhook_secret=

[watchers]
# ENABLE WATCHER
# Should KGSM automatically start a watcher process for each game server instance?
# When enabled, a watcher will check the log file and the port to be open when
# an instance is started, in order to send out a ready event.
# If the watcher finds the ready message in the log file or the port is open,
# the watcher will stop and the instance will be considered ready.
#
# Dependencies: tail, grep, ss, socat
#
# Expected values:
#   false  - Don't start watcher processes
#   true   - Start watcher processes for each instance
#
# Default: false
enable_watcher=false

# WATCHER TIMEOUT
# How long should KGSM wait for a game server to become ready?
# This is the time allowed for the background watcher to find the ready
# message in the log file or the port to be open.
# This applies to all instances.
# After this timeout is reached, the watcher will be stopped and the instance
# will be considered not ready.
#
# Expected values:
#   Positive integer (seconds)
#
# Default: 600 (10 minutes)
watcher_global_timeout_seconds=600

# WATCHER PORTS CHECK INTERVAL
# How often should KGSM check the ports to be open?
# This applies to all instances.
#
# Expected values:
#   Positive integer (seconds)
#
# Default: 5
watcher_ports_check_interval_seconds=5

[instance_defaults]
# DEFAULT LIBRARY
# Which library is this host's default for new game server instances?
# A library is a named root registered with `kgsm libraries add <path>`;
# `kgsm libraries list` shows the registered ones with their free space.
# With exactly one library registered, that one is the default even when this
# key is empty.
#
# Expected values:
#   The name of a registered library (leave empty to choose per instance)
#
# Default: Empty
default_library=

# INSTALL FREE SPACE MARGIN
# How much room should be left free in a library after an install?
# Before downloading, KGSM compares the library's free space against the
# blueprint's declared metadata.base_disk_mb plus this margin, and refuses the
# install when it does not fit. A blueprint that declares no size leaves nothing
# to compare and the check is skipped with a warning.
#
# The margin covers what the declared size does not: the download staged in the
# instance's temp directory before it is deployed, and the room a game server
# needs to write saves and logs once it runs.
#
# Expected values:
#   Positive integer (megabytes)
#
# Default: 1024
install_free_space_margin_mb=1024

# INSTANCE NAME SUFFIX LENGTH
# How many random digits should be appended to auto-generated instance names?
# This creates unique identifiers for each server instance.
# Examples: minecraft-42, factorio-07, valheim-91
#
# Expected values:
#   Integer between 1 and 10
#
# Default: 2
instance_suffix_length=2

# BACKUPS DIRECTORY
# Where should KGSM keep instance backups?
# Backups are stored outside every instance's working directory, in a
# per-instance subdirectory of this root, so that uninstalling an instance
# never destroys its backups. Point this at another filesystem or a mounted
# volume to keep backups off the disk that holds the game servers.
#
# Expected values:
#   Absolute path to a writable directory (leave empty for the default)
#
# Default: Empty ($XDG_DATA_HOME/kgsm/backups, i.e. ~/.local/share/kgsm/backups)
backups_directory=

# ENABLE BACKUP COMPRESSION
# Should KGSM automatically compress backup files to save disk space?
# When enabled, backup files will be compressed during creation and
# decompressed during restoration.
#
# A compressed backup is a single data.tar.gz carrying an sha256 digest, which
# is what makes it verifiable before a restore and transferable as one artifact.
# An uncompressed backup is a data/ tree: no single digest exists for it, so a
# restore cannot verify it and nothing downstream can hand it over as one file.
#
# Dependencies: tar
#
# Expected values:
#   false  - Store backups uncompressed
#   true   - Automatically compress backups
#
# Default: true
enable_backup_compression=true

# SAVE COMMAND TIMEOUT
# How long should KGSM wait for a 'save' command to complete?
# This is the time allowed for a game server to finish saving after
# the save command is issued.
#
# Note: This can be customized per-instance after creation
#
# Expected values:
#   Positive integer (seconds)
#
# Default: 5
instance_save_command_timeout_seconds=5

# STOP COMMAND TIMEOUT
# How long should KGSM wait for a game server to shut down gracefully?
# After this timeout, if the server hasn't stopped, the process will be killed.
#
# Note: This can be customized per-instance after creation
#
# Expected values:
#   Positive integer (seconds)
#
# Default: 30
instance_stop_command_timeout_seconds=30

# AUTO UPDATE BEFORE START
# Should KGSM update the instance before starting it up?
# Before starting up an instance, it will run through the update process
# and download the latest version.
#
# Note: This can be customized per-instance after creation
#
# Expected values:
#   false   - Instances don't automatically update
#   true    - Instances will update before starting
#
# Default: false
instance_auto_update_before_start=false
instance_cpu_priority=normal
instance_memory_cap_mb=0
instance_scheduled_restart=off
instance_restart_time=04:00
instance_restart_day=sun
instance_timezone=
instance_auto_backup_on_restart=false
instance_backup_retention=5
# Announcement lead times before a scheduled restart, comma-separated minutes
# (e.g. 15,5,1). Empty announces nothing. Requires the kgsm-scheduler leaf and a
# blueprint that declares a broadcast_command.
instance_announce_lead_minutes=
instance_announce_restart_message=Server restart in {minutes} min
instance_announce_restart_cancelled_message=Server restart cancelled
instance_crash_restart=true
instance_crash_max_restarts=5

[accessibility]
# ENABLE COMMAND SHORTCUTS
# Should KGSM create command shortcuts for easier server management?
# When enabled, symbolic links will be created in a directory on your PATH,
# allowing you to run server commands from anywhere.
#
# Expected values:
#   false  - Don't create shortcuts
#   true   - Create command shortcuts
#
# Default: false
enable_command_shortcuts=false

# SHORTCUT DIRECTORY
# Where should command shortcuts be created?
# This directory should be in your PATH environment variable.
# Only used when command shortcuts are enabled.
#
# Examples of shortcut usage:
#   Instead of typing:
#     - kgsm.sh start minecraft-42
#     - kgsm.sh stop factorio-07
#     - kgsm.sh create-backup valheim-91
#   You can use:
#     - minecraft-42 start
#     - factorio-07 stop
#     - valheim-91 create-backup
#   This allows for quick server management without needing to specify the full kgsm.sh command.
#
# This must be a directory you can write to without root. KGSM never uses
# sudo to create or remove shortcuts; if the directory is not writable the
# enable step fails with a clear error instead of prompting for a password.
# A leading ~ or $HOME is expanded, and the default (~/.local/bin) is created
# automatically when it lives under your home directory.
#
# For a system-wide shortcut, set this to /usr/local/bin and make sure that
# directory is writable by the KGSM user (or pre-create the shortcuts there).
#
# Expected values:
#   A writable directory on your PATH (e.g. ~/.local/bin, ~/bin, /usr/local/bin)
#
# Default: $HOME/.local/bin
command_shortcuts_directory=$HOME/.local/bin
