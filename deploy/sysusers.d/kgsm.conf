# systemd-sysusers fragment — the KGSM service account.
#
# Every kgsm-* unit runs as this user, and the engine's instance data lives under its home. Each
# project ships its own copy under a distinct filename so two packages never claim the same path;
# systemd-sysusers merges identical declarations, so the account is created exactly once however
# many of them land on a host.
#
# kgsm-firewall's daemon runs as root and still needs this: its socket is SocketGroup=kgsm, which
# is what lets the unprivileged engine talk to it.
#
#Type Name  ID  GECOS                        Home directory  Shell
u     kgsm  -   "KGSM game server manager"   /var/lib/kgsm   /usr/bin/nologin
